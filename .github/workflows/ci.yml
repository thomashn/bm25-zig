name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1.4.0
        with:
          zig-version: 0.16.0
      - name: Check formatting
        run: zig fmt --check src/ build.zig
      - name: Test
        run: zig build test
      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1.4.0
        with:
          zig-version: 0.16.0
      - name: Test
        run: zig build test
      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: korandoru/setup-zig@v1.4.0
        with:
          zig-version: 0.16.0
      - name: Test
        run: zig build test
      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
